name: CI
on: [push, pull_request]
env:
  FORCE_COLOR: true
jobs:
  ci:
    name: Bun
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Typecheck
      run: bun run typecheck
    - name: Test
      run: bun test
